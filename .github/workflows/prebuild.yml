# Builds prebuilt binaries for every supported platform and, on a version tag,
# stages the package with them bundled on npm. It uses npm trusted publishing
# (OIDC): no token is stored; the package's Trusted Publisher settings on
# npmjs.com must name this repository and this workflow file. The staged
# version is not public until a maintainer approves it, with 2FA:
#   npm stage list @vlasky/shacrypt
#   npm stage approve <stage-id>
name: Prebuild and stage release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  prebuild:
    name: Prebuild on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # linux-x64
          - ubuntu-24.04-arm   # linux-arm64
          - macos-15-intel     # darwin-x64
          - macos-latest       # darwin-arm64
          - windows-2022       # win32-x64 (windows-latest has VS 2026, unknown to older node-gyp)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run prebuildify
      - name: Check that the prebuilt binary loads and passes the tests
        run: npx mocha
        env:
          # Force node-gyp-build to use prebuilds/ rather than build/Release
          PREBUILDS_ONLY: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.os }}
          path: prebuilds/
          if-no-files-found: error

  stage:
    name: Stage release on npm
    needs: prebuild
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5.1 or newer; Node 24 ships npm 11.
          # No registry-url: with it, setup-node writes an .npmrc that sends a
          # placeholder NODE_AUTH_TOKEN, and npm then uses that instead of OIDC.
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: prebuilds
          pattern: prebuilds-*
          merge-multiple: true
      - name: List bundled prebuilds
        run: find prebuilds -type f
      - run: npm ci --ignore-scripts
      - run: npm --version
      - run: npm stage publish --provenance --access public
