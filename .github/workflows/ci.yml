name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint:
    name: Lint (ESLint and TypeScript checkJs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # ESLint 10 needs Node 20.19+, so linting runs once here rather than
          # inside the test matrix, which includes Node 18.
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run lint

  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 rather than windows-latest: the newer image ships Visual
        # Studio 2026, which the node-gyp bundled with Node 18 to 22 cannot find.
        os: [ubuntu-latest, macos-latest, windows-2022]
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install (compiles the addon from source)
        run: npm ci
      - name: Test
        run: npm test
      - name: Show what would be published
        run: npm pack --dry-run
